name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use private vulnerability reporting from the Security tab.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Configure…
        3. Observe…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit SHA, container tag, or branch.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Public picker
        - Admin settings
        - Audit logs
        - Authentication
        - Sharing metadata
        - Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots. Remove passwords, cookies, secrets, and personal data.
